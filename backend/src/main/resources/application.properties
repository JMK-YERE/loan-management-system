server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=JmkLoanApp

# PostgreSQL / Neon
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# Schema changes are managed explicitly in Neon to prevent Hibernate startup locks/timeouts.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Hikari
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=10000

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend
app.frontend.url=${APP_FRONTEND_URL:}
google.client.id=${GOOGLE_CLIENT_ID:}

# Email - optional at startup; configure real credentials in Render to enable email
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.loanapp=INFO

# Automated reminders
app.due-reminders.cron=${DUE_REMINDERS_CRON:0 0 9 * * *}
app.reminders.cron=${REMINDERS_CRON:0 0 8 * * *}

# Twilio SMS - set real credentials in Render Environment, never commit secrets
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.from=${TWILIO_FROM:}
app.twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:}

# Payment gateway adapter (real provider credentials required before live money movement)
app.payments.provider=${PAYMENT_PROVIDER:DISABLED}
app.payments.base-url=${PAYMENT_BASE_URL:}
app.payments.api-key=${PAYMENT_API_KEY:}
app.payments.api-secret=${PAYMENT_API_SECRET:}
app.payments.merchant-id=${PAYMENT_MERCHANT_ID:}
app.payments.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}

# NIDA stakeholder verification - endpoint/credentials must come from NIDA onboarding
app.nida.verification-url=${NIDA_VERIFICATION_URL:}
app.nida.api-key=${NIDA_API_KEY:}

# Demo accounts are seeded only when DEMO_SEED_ENABLED=true
app.demo.seed-enabled=${DEMO_SEED_ENABLED:false}
app.demo.lender-password=${DEMO_LENDER_PASSWORD:}
app.demo.borrower-password=${DEMO_BORROWER_PASSWORD:}
app.demo.guarantor-password=${DEMO_GUARANTOR_PASSWORD:}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:}

# Security hardening
app.security.rate-limit.requests=${RATE_LIMIT_REQUESTS:60}
app.security.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
