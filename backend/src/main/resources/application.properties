# Server
server.port=8080
spring.application.name=loan-management-system

# Database (Neon PostgreSQL) - BADILISHA HAYA
spring.datasource.url=jdbc:postgresql://your-neon-host/loan_db
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=my-super-secret-key-for-loan-app-change-this-in-production-minimum-256-bits-long
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.loanapp=DEBUG
